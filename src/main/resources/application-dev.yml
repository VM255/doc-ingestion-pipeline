# Development Profile: Local Neo4j + Local/Mock LLM Settings
spring:
  main:
    allow-circular-references: true

  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7688}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:password}
    pool:
      max-connection-pool-size: 10
      connection-acquisition-timeout-ms: 30000

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:mock-local-key}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.0

    vectorstore:
      neo4j:
        initialize-schema: false
        database-name: neo4j
        index-name: dev-document-embeddings

server:
  port: ${PORT:8088}

logging:
  level:
    root: INFO
    com.example.graphrag: DEBUG
    org.springframework.ai: DEBUG
    org.neo4j.driver: DEBUG
