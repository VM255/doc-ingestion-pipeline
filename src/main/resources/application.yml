spring:
  main:
    allow-circular-references: true
  application:
    name: doc-ingestion-pipeline
  profiles:
    active: dev

  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:documindpassword}
    pool:
      max-connection-pool-size: 50
      connection-acquisition-timeout-ms: 60000
      idle-time-before-connection-test-ms: 30000

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:demo-key}
      chat:
        options:
          model: gpt-4o
          temperature: 0.2
      embedding:
        options:
          model: text-embedding-3-small

    vectorstore:
      neo4j:
        initialize-schema: false
        database-name: neo4j
        index-name: document-embeddings
        embedding-dimension: 1536
        distance-type: cosine
        label: DocumentChunk

    mcp:
      server:
        name: graphrag-knowledge-server
        version: 1.0.0

graphrag:
  chunking:
    size: 500
    overlap: 50

server:
  port: ${PORT:8088}

logging:
  level:
    com.example.graphrag: INFO
    org.springframework.ai: INFO