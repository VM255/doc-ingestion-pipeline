# Production Profile: Neo4j AuraDB + Rate-Limited OpenAI
spring:
  neo4j:
    uri: ${NEO4J_URI:neo4j+s://your-auradb-instance.databases.neo4j.io}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD}
    pool:
      max-connection-pool-size: 100
      connection-acquisition-timeout-ms: 120000
      idle-time-before-connection-test-ms: 15000

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o
          temperature: 0.1
          max-tokens: 4096
      embedding:
        options:
          model: text-embedding-3-large

    vectorstore:
      neo4j:
        initialize-schema: false
        database-name: neo4j
        index-name: prod-document-embeddings
        embedding-dimension: 3072

    retry:
      max-attempts: 5
      backoff:
        initial-interval: 2000ms
        multiplier: 2.5
        max-interval: 30000ms

logging:
  level:
    root: WARN
    com.example.graphrag: INFO
    org.springframework.ai: WARN
    org.neo4j.driver: WARN
